# Server Configuration
spring.application.name=wexa
server.port=8080

# CognoDB Connection Settings (Spring Data Neo4j)
# Environment variables are used to prevent committing secrets to GitHub
spring.neo4j.uri=${COGNODB_URI}
spring.neo4j.authentication.username=${COGNODB_USERNAME}
spring.neo4j.authentication.password=${COGNODB_PASSWORD}

# Application Logging Level
logging.level.org.springframework.data.neo4j=INFO